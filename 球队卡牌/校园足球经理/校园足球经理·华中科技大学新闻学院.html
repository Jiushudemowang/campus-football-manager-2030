for(let i=0;i<6;i++){const P=hp(mR+15,i);const a=i===0||i===3?'middle':(i<3?'start':'end');s+='<text x="'+P.x+'" y="'+P.y+'" fill="'+cls[i]+'" font-family="\'JetBrains Mono\',monospace" font-size="8" font-weight="600" text-anchor="'+a+'" dominant-baseline="middle">'+lbs[i]+'</text>';}
s+='</svg>';return s;}
