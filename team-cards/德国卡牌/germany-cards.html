function gR(p){const cx=120,cy=120,mR=95;const lbs=['PAC','SHO','PAS','DEF','PHY','DRI'];const vs=[p.pac,p.sho,p.pas,p.def,p.phy,p.dri];const cls=['#DD0000','#FF6B00','#0050A0','#000000','#333','#FFCC00'];function hp(r,i){const a=(i*60-90)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
let s='<svg viewBox="0 0 240 240">';for(let r=1;r<=5;r++){const R=mR*(r/5);const pts=Array.from({length:6},(_,i)=>{const P=hp(R,i);return P.x+','+P.y}).join(' ');s+='<polygon points="'+pts+'" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>';}
for(let i=0;i<6;i++){const P=hp(mR,i);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+P.x+'" y2="'+P.y+'" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>';}
const dP=Array.from({length:6},(_,i)=>{const r=mR*(vs[i]/99)*1.05;const P=hp(r,i);return P.x+','+P.y}).join(' ');s+='<polygon points="'+dP+'" fill="rgba(221,0,0,0.06)" stroke="#DD0000" stroke-width="2" stroke-linejoin="round"/>';
for(let i=0;i<6;i++){const r=mR*(vs[i]/99)*1.05;const P=hp(r,i);s+='<circle cx="'+P.x+'" cy="'+P.y+'" r="4" fill="'+cls[i]+'" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>';}
for(let i=0;i<6;i++){const P=hp(mR+22,i);const a=i===0||i===3?'middle':(i<3?'start':'end');s+='<text x="'+P.x+'" y="'+P.y+'" fill="'+cls[i]+'" font-family="\'JetBrains Mono\',monospace" font-size="11" font-weight="600" text-anchor="'+a+'" dominant-baseline="middle">'+lbs[i]+'</text>';}
s+='<text x="120" y="124" fill="rgba(0,0,0,0.08)" font-family="\'Oswald\',sans-serif" font-size="16" font-weight="700" text-anchor="middle">'+p.ovr+'</text>';
s+='<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';s+='</svg>';return s;}

function rC(f){const g=document.getElementById('cardGrid');g.innerHTML='';const l=f==='all'?P:f==='starter'?P.filter(p=>p.starter):f==='sub'?P.filter(p=>!p.starter):P.filter(p=>p.rarity===f);
const sM={legendary:5,epic:4,gold:3};l.forEach(p=>{const st=sM[p.rarity]||3;const ss=Array(st).fill('★').join('');const rN={legendary:'LEGENDARY',epic:'EPIC',gold:'GOLD'}[p.rarity];
const c=document.createElement('div');c.className='flip-container '+p.rarity;c.innerHTML=`
<div class="flip-inner"><div class="card-front"><img class="front-bg" src="germany-cards/${p.id}.jpg" alt="${p.nameEn}" loading="lazy" onerror="this.style.display='none'"><div class="front-overlay"></div>${!p.starter?'<div class="front-sub">SUB</div>':''}
<div class="front-content"><div class="front-top-bar"><div class="front-nation-badge"><span class="flag">🇩🇪</span><span class="name">GERMANY</span></div><div class="front-stars">${ss}</div></div>
<div class="front-ovr-block"><div class="front-ovr-num">${p.ovr}</div><div class="front-pos-text">${p.pos}</div></div>
<div class="front-bottom"><div><div class="front-name">${p.nameEn}${p.captain?'<span class="front-captain">Ⓒ</span>':''}</div><div class="front-name-zh">${p.nameZh}</div><div class="front-club">${p.club}</div></div>
<div class="front-ui-panel"><div class="front-skill-icons"><div class="front-skill-icon">${p.skill.split(' ')[0]}</div><div class="front-skill-icon">⚽</div></div><div class="front-bottom-stars">${ss}</div></div></div></div></div>
<div class="card-back"><div class="top-accent"></div><div class="card-inner">${!p.starter?'<div class="sub-badge">SUB</div>':''}
<div class="card-series"><span class="series-name">🇩🇪 WORLD CUP 2026</span><span class="card-type">${rN}</span></div>
<div class="card-identity"><div class="nation"><span class="flag">🇩🇪</span><span class="nation-name">GERMANY</span></div><div class="ovr-badge"><span class="ovr-number">${p.ovr}</span><span class="ovr-label">OVERALL</span></div></div>
<div class="card-position-name"><div class="pos-badge">${p.pos}</div><div class="card-player-name"><div class="name-en">${p.nameEn}${p.captain?' Ⓒ':''}</div><div class="name-zh">${p.nameZh}</div><div class="club-name">${p.club}</div></div></div>
<div class="radar-container"><svg viewBox="0 0 240 240">${gR(p)}</svg></div>
<div class="stat-bars">${['pac','sho','pas','dri','def','phy'].map(s=>'<div class="stat-row '+s+'"><span class="stat-label '+s+'">'+s.toUpperCase()+'</span><div class="stat-track"><div class="stat-fill" style="width:'+p[s]+'%"></div></div><span class="stat-value">'+p[s]+'</span></div>').join('')}</div>
<div class="card-footer"><span class="skill-badge"><span class="skill-icon">${p.skill.split(' ')[0]}</span>${p.skill.slice(p.skill.indexOf(' ')+1)}</span><span class="rarity-stars">${ss}<span class="rarity-label">${p.rarity==='legendary'?'神话':p.rarity==='epic'?'史诗':'精英'}</span></span></div>
<div class="play-style">${p.style}${p.note?' · '+p.note:''}</div></div></div></div>`;
g.appendChild(c);c.addEventListener('mouseenter',()=>c.classList.add('flipped'));c.addEventListener('mouseleave',()=>c.classList.remove('flipped'));});}
document.querySelectorAll('.filter-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');rC(b.dataset.filter);});});
document.addEventListener('DOMContentLoaded',()=>rC('all'));
</script></body></html>
